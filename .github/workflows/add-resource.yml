name: Add Resource from Issue

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  assign-copilot:
    if: >-
      contains(github.event.issue.labels.*.name, 'add-resource') ||
      (github.event.action == 'labeled' && github.event.label.name == 'add-resource')
    runs-on: ubuntu-latest

    steps:
      - name: Ensure add-resource label exists
        run: |
          gh label create "add-resource" \
            --repo "$GITHUB_REPOSITORY" \
            --description "Request to add a new resource" \
            --color "0E8A16" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assign issue to Copilot coding agent
        run: |
          gh issue edit "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --add-assignee "copilot"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
